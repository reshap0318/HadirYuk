# ═══════════════════════════════════════════════════════════════
#  HadirYuk — Development Overrides
#  Auto-merged: docker compose up
#  mkdir -p be/storage
#  sudo chown -R 1000:1000 be/storage
# ═══════════════════════════════════════════════════════════════

services:
  backend:
    build:
      dockerfile: ../etc/Dockerfile.be-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./be/storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - hadiryuk-net
      - mysql-network
      - redis-network

  frontend:
    build:
      context: .
      dockerfile: etc/Dockerfile.fe-dev
    ports:
      - "9010:5173"
    volumes:
      - ./fe:/app
      - /app/node_modules
    command: npx vite --host 0.0.0.0 --port 5173
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  mysql-network:
    external: true
  redis-network:
    external: true
