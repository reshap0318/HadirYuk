# ═══════════════════════════════════════════════════════════════
#  HadirYuk — Production Overrides
#  Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════════

services:
  backend:
    volumes:
      - hadiryuk-storage:/app/storage
    networks:
      - hadiryuk-net
      - mysql-network
      - redis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2"
    #       memory: 1G
    #     reservations:
    #       cpus: "1"
    #       memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports:
      - "9010:80"
    networks:
      - hadiryuk-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hadiryuk-storage:
    driver: local

networks:
  mysql-network:
    external: true
  redis-network:
    external: true
